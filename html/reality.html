<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality | Simulation</title>
    <link rel="stylesheet" href="../css/reality.css?v=2">
    <link rel="icon" href="../assets/matrix-rabbit.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/matrix-rabbit-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/matrix-rabbit-180.png">
</head>

<body>
    <div id="loading">Loading Simulation...</div>
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <div class="reality-status">
            <span class="status-dot"></span>
            SIMULATION ACTIVE
        </div>
        <div class="simulation-controls">
            <p id="camera-hint">An ordinary day. Almost.</p>
            <div class="control-buttons">
                <button id="camera-toggle" type="button" aria-pressed="false">ENTER THE CROWD</button>
                <button id="sound-toggle" type="button" aria-pressed="false">SOUND OFF</button>
                <button id="glitch-toggle" type="button" aria-pressed="true">GLITCHES ON</button>
                <button id="logout-btn" class="logout-btn" type="button">WAKE UP</button>
            </div>
            <div id="walk-controls" hidden aria-label="Walking controls">
                <button type="button" data-key="KeyA" aria-label="Walk left">←</button>
                <button type="button" data-key="KeyW" aria-label="Walk forward">↑</button>
                <button type="button" data-key="KeyS" aria-label="Walk backward">↓</button>
                <button type="button" data-key="KeyD" aria-label="Walk right">→</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/reality.js"></script>
</body>

</html>
